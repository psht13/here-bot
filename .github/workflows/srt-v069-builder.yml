name: Smart TV Remote v0.6.9 artifact access test

on:
  push:
    branches:
      - temp/srt-v069-builder

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download public avl-tree build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/psht13/avl-tree/actions/artifacts/8820602313/zip \
            -o /tmp/base.zip
          unzip -t /tmp/base.zip
          unzip -l /tmp/base.zip | head -30
